version: 2

models:
  - name: stg_flotation
    description: Telemetría horaria de planta de flotación, limpia y tipada desde raw_flotation_telemetry.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
              combination_of_columns:
                - faena
                - ts
    columns:
      - name: record_id
        tests: [unique, not_null]
      - name: faena
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Andina', 'Los Bronces', 'El Teniente']
      - name: turno
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Día', 'Noche']
      - name: ley_alimentacion_cu_pct
        description: Ley de cobre en la alimentación a flotación (%) -- rango de telemetría 0-100.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 100
      - name: ley_concentrado_cu_pct
        description: Ley de cobre en el concentrado (%) -- rango de telemetría 0-100.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 100
      - name: ley_cola_cu_pct
        description: Ley de cobre en la cola/relave (%) -- rango de telemetría 0-100.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 100
      - name: ph_pulpa
        description: pH de la pulpa -- rango de telemetría de la escala pH, 0-14.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 14
      - name: dosis_reactivo_gpt
        description: Dosis de reactivo colector (g/ton) -- no puede ser negativa.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
      - name: tonelaje_hora_ton
        description: Tonelaje procesado en la hora (ton) -- no puede ser negativo.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0

  - name: stg_maintenance
    description: Registro de horas operativas/mantención CAEX por camión, día y turno, limpio desde raw_caex_maintenance.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
              combination_of_columns:
                - camion_id
                - fecha
                - turno
    columns:
      - name: record_id
        tests: [unique, not_null]
      - name: camion_id
        tests: [not_null]
      - name: horas_operativas
        description: Horas operativas del turno -- rango de telemetría 0 a 12 (turno programado estándar).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 12
      - name: horas_turno_programadas
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 24
      - name: horas_mantencion_programada
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
      - name: horas_falla_no_programada
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
      - name: fill_factor
        description: Factor de llenado del balde CAEX -- rango de telemetría físicamente plausible 0-1.3 (permite algo de sobrellenado real, no un límite exacto de 1.0).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
                  max_value: 1.3

  - name: stg_safety
    description: Incidentes de seguridad limpios y normalizados desde raw_safety_incidents.
    columns:
      - name: incident_id
        tests: [unique, not_null]
      - name: severidad
        tests:
          - accepted_values:
              arguments:
                values: ['LEVE', 'GRAVE', 'FATAL']
      - name: horas_detencion_asociadas
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                  min_value: 0
